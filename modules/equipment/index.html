<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仓储运营管理平台 - 设备管理</title>
  <style>
    :root {
      --bg: #071012;
      --panel: rgba(12, 22, 24, 0.78);
      --panel-soft: rgba(255, 255, 255, 0.045);
      --ink: #edf7f3;
      --muted: #8ba09b;
      --line: rgba(201, 255, 244, 0.10);
      --line-strong: rgba(201, 255, 244, 0.18);
      --accent: #6ee7d2;
      --accent-2: #ffe0a3;
      --blue: #8fb8ff;
      --lime: #b7f7a8;
      --rose: #ffb3a7;
      --violet: #b9a7ff;
      --warn: #f5c77a;
      --danger: #ff9f8f;
      --ok: #8bf0c1;
      --radius: 18px;
      --shadow: 0 24px 80px rgba(0,0,0,0.36);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 14px/1.55 "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(rgba(169,222,211,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(169,222,211,.035) 1px, transparent 1px),
        radial-gradient(circle at 12% 2%, rgba(110,231,210,.16), transparent 24%),
        radial-gradient(circle at 96% 8%, rgba(255,224,163,.12), transparent 24%),
        linear-gradient(180deg, #071012 0%, #0b1416 48%, #070b0d 100%);
      background-size: 24px 24px, 24px 24px, auto, auto, auto;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .page { max-width: 1800px; margin: 0 auto; padding: 22px 24px 56px; }
    .shell, .panel, .metric-card, .drawer {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .platform-header {
      min-height: 70px;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: linear-gradient(180deg, rgba(15, 25, 27, .94), rgba(9, 17, 19, .86));
    }
    .brand { min-width: 0; display: flex; align-items: center; gap: 14px; }
    .platform-mark {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.72);
      object-fit: contain;
      background: #fff;
      flex: 0 0 auto;
    }
    .brand-title { display: grid; gap: 4px; min-width: 0; }
    .brand-title strong { font-size: 16px; line-height: 1.2; }
    .crumbs { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .back-link {
      min-height: 38px;
      padding: 9px 13px;
      border-radius: 12px;
      color: #061311;
      background: linear-gradient(135deg, var(--accent), #fff1cb);
      text-decoration: none;
      font-weight: 800;
      white-space: nowrap;
    }
    .hero {
      margin-bottom: 16px;
      padding: 24px;
      border-radius: 22px;
      overflow: hidden;
      position: relative;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: auto -8% -38% 48%;
      height: 220px;
      background: radial-gradient(circle, rgba(110,231,210,.18), transparent 62%);
      pointer-events: none;
    }
    .hero-top {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
    }
    .eyebrow, .panel-label {
      display: inline-flex;
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(36px, 4.6vw, 66px); line-height: .98; letter-spacing: 0; }
    h2 { font-size: 21px; line-height: 1.22; }
    h3 { font-size: 16px; line-height: 1.25; }
    .hero-sub { margin-top: 12px; color: var(--muted); max-width: 900px; }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .hero-chip {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.035);
    }
    .toolbar {
      margin-bottom: 16px;
      padding: 18px 20px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .toolbar h1 {
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1;
    }
    .toolbar .hero-meta {
      margin-top: 10px;
    }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .action-btn, .ghost-btn, .table-btn, .op-btn {
      border: 1px solid var(--line-strong);
      color: var(--ink);
      background: rgba(255,255,255,.055);
      border-radius: 12px;
      min-height: 38px;
      padding: 8px 12px;
      font-weight: 760;
    }
    .action-btn.primary {
      color: #061311;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: rgba(255,255,255,.22);
    }
    .filter-panel { position: relative; z-index: 20; padding: 18px; border-radius: 18px; margin-bottom: 16px; }
    .filters {
      display: grid;
      grid-template-columns: repeat(6, minmax(140px, 1fr));
      gap: 12px;
    }
    .field { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .combo-field { position: relative; }
    .field input, .field select {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: 0;
      color: var(--ink);
      background: rgba(255,255,255,.045);
      color-scheme: dark;
    }
    .field select option {
      color: #edf7f3;
      background: #0d181a;
    }
    .field select option:checked {
      color: #061311;
      background: #6ee7d2;
    }
    .field input:focus, .field select:focus { border-color: rgba(110,231,210,.55); box-shadow: 0 0 0 3px rgba(110,231,210,.09); }
    .combo-input-wrap { position: relative; }
    .combo-input-wrap input { padding-right: 34px; }
    .combo-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      pointer-events: none;
      font-size: 13px;
    }
    .combo-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      z-index: 200;
      max-height: 280px;
      overflow: auto;
      padding: 8px;
      border: 1px solid rgba(110,231,210,.28);
      border-radius: 14px;
      background: rgba(9, 17, 19, .98);
      box-shadow: 0 22px 60px rgba(0,0,0,.46);
      display: none;
      gap: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(110,231,210,.28) transparent;
    }
    .combo-menu.is-open { display: grid; }
    .combo-menu::-webkit-scrollbar { width: 6px; }
    .combo-menu::-webkit-scrollbar-track { background: transparent; }
    .combo-menu::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(110,231,210,.22); }
    .combo-option {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      background: rgba(255,255,255,.035);
      text-align: left;
      font-weight: 780;
    }
    .combo-option:hover, .combo-option.is-active {
      border-color: rgba(110,231,210,.36);
      background: rgba(110,231,210,.10);
    }
    .combo-option span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .combo-option small { color: var(--muted); font-weight: 760; white-space: nowrap; }
    .combo-empty {
      min-height: 38px;
      padding: 9px 10px;
      color: var(--muted);
      border: 1px dashed var(--line-strong);
      border-radius: 10px;
      background: rgba(255,255,255,.025);
    }
    .filter-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; }
    .active-note { color: var(--muted); font-size: 13px; }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric-card {
      min-height: 126px;
      padding: 16px;
      border-radius: 16px;
      text-align: left;
      color: var(--ink);
      position: relative;
      overflow: hidden;
      --card-accent: var(--accent);
      --card-glow: rgba(110,231,210,.11);
      background:
        radial-gradient(circle at 86% 18%, var(--card-glow), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,.045), rgba(255,255,255,.018)),
        var(--panel);
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }
    .metric-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, var(--card-accent), transparent);
      opacity: .9;
    }
    .metric-card:hover, .metric-card.is-active {
      border-color: color-mix(in srgb, var(--card-accent) 56%, transparent);
      transform: translateY(-1px);
      background:
        radial-gradient(circle at 86% 18%, var(--card-glow), transparent 38%),
        linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.022)),
        var(--panel);
    }
    .metric-card span { color: var(--muted); font-size: 12px; font-weight: 800; }
    .metric-card strong {
      display: block;
      margin-top: 10px;
      font-size: clamp(24px, 2vw, 32px);
      line-height: 1.02;
      overflow-wrap: anywhere;
    }
    .metric-card small { display: block; margin-top: 10px; color: var(--muted); }
    .metric-card[data-tone="mint"] { --card-accent: var(--accent); --card-glow: rgba(110,231,210,.12); }
    .metric-card[data-tone="gold"] { --card-accent: var(--accent-2); --card-glow: rgba(255,224,163,.13); }
    .metric-card[data-tone="blue"] { --card-accent: var(--blue); --card-glow: rgba(143,184,255,.13); }
    .metric-card[data-tone="lime"] { --card-accent: var(--lime); --card-glow: rgba(183,247,168,.12); }
    .metric-card[data-tone="rose"] { --card-accent: var(--rose); --card-glow: rgba(255,179,167,.13); }
    main { display: grid; gap: 16px; }
    .support-grid {
      display: grid;
      grid-template-columns: minmax(360px, .9fr) minmax(520px, 1.1fr);
      grid-template-areas:
        "source source"
        "mix dept";
      gap: 16px;
      align-items: stretch;
    }
    #asset-table {
      padding: 24px;
      box-shadow: 0 22px 70px rgba(0,0,0,.24), inset 0 1px 0 rgba(110,231,210,.08);
    }
    .panel { padding: 20px; border-radius: 18px; min-width: 0; }
    .panel-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 14px; }
    .muted { color: var(--muted); }
    .ledger-panel .table-wrap { max-height: 760px; }
    .mix-panel { grid-area: mix; }
    .dept-panel { grid-area: dept; }
    .source-panel { grid-area: source; }
    .donut-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: center;
      justify-items: center;
    }
    .donut {
      width: min(190px, 58%);
      aspect-ratio: 1;
      border-radius: 999px;
      background: conic-gradient(var(--accent) 0 100%);
      position: relative;
      box-shadow: inset 0 0 28px rgba(255,255,255,.08), 0 16px 42px rgba(0,0,0,.24);
    }
    .donut::after {
      content: attr(data-total);
      position: absolute;
      inset: 30px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #0b1416;
      color: var(--ink);
      font-size: 28px;
      font-weight: 850;
    }
    .mix-panel .chart-list { width: 100%; }
    .chart-list, .quality-list, .priority-list, .source-list { display: grid; gap: 9px; }
    .source-panel .source-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .priority-list {
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      max-height: 680px;
      overflow: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(110,231,210,.22) transparent;
    }
    .priority-list::-webkit-scrollbar { width: 6px; }
    .priority-list::-webkit-scrollbar-track { background: transparent; }
    .priority-list::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(110,231,210,.18);
    }
    .priority-list::-webkit-scrollbar-thumb:hover {
      background: rgba(110,231,210,.34);
    }
    .chart-row, .quality-card, .priority-row, .source-row {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.035);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .chart-row, .source-row { cursor: pointer; }
    .chart-row:hover, .quality-card:hover, .source-row:hover, .dept-row:hover { border-color: rgba(110,231,210,.38); }
    .chart-row.is-active, .source-row.is-active, .dept-row.is-active {
      border-color: rgba(110,231,210,.45);
      background: linear-gradient(135deg, rgba(110,231,210,.11), rgba(255,221,148,.05));
    }
    .row-main { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .bar-track { margin-top: 7px; height: 8px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.06); }
    .bar-fill {
      height: 100%;
      width: var(--w);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--bar-color, var(--accent)), color-mix(in srgb, var(--bar-color, var(--accent)) 46%, var(--accent-2)));
    }
    .dept-bars { display: grid; gap: 10px; }
    .dept-row {
      display: grid;
      grid-template-columns: minmax(120px, .9fr) minmax(0, 1.5fr) 52px;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 3px 6px;
    }
    .dept-name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dept-count { text-align: right; font-weight: 850; }
    .priority-row { display: grid; gap: 8px; cursor: pointer; min-height: 108px; align-content: start; }
    .priority-panel .panel-head h2 { font-size: 28px; }
    .priority-title { display: flex; justify-content: space-between; gap: 10px; }
    .priority-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; color: var(--muted); font-size: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--accent);
      background: rgba(110,231,210,.09);
      border: 1px solid rgba(110,231,210,.16);
      font-size: 12px;
      font-weight: 800;
    }
    .tag.warn { color: var(--warn); background: rgba(245,199,122,.10); border-color: rgba(245,199,122,.18); }
    .tag.danger { color: var(--danger); background: rgba(255,159,143,.10); border-color: rgba(255,159,143,.18); }
    .quality-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .quality-card {
      cursor: pointer;
      min-height: 118px;
      color: var(--ink);
      text-align: center;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 8px;
    }
    .quality-card strong {
      display: block;
      color: var(--ink);
      font-size: 27px;
      line-height: 1;
      letter-spacing: 0;
    }
    .quality-card small { display: block; color: var(--muted); }
    .table-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      align-items: end;
      gap: 16px;
      margin-bottom: 12px;
    }
    .table-actions {
      display: grid;
      grid-template-columns: auto auto auto auto;
      gap: 8px;
      align-items: end;
      justify-content: end;
    }
    .table-actions .field {
      min-width: 86px;
      gap: 4px;
    }
    .table-actions .field select {
      min-height: 38px;
    }
    .table-actions [data-selected-info] {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.035);
      white-space: nowrap;
    }
    .column-menu { position: relative; }
    .column-menu details { position: relative; }
    .column-menu summary { list-style: none; }
    .column-menu summary::-webkit-details-marker { display: none; }
    .column-panel {
      position: absolute;
      right: 0;
      top: 44px;
      z-index: 5;
      min-width: 210px;
      max-height: 320px;
      overflow: auto;
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: #0d181a;
      box-shadow: var(--shadow);
      display: grid;
      gap: 7px;
    }
    .column-panel label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      max-height: 680px;
      scrollbar-width: thin;
      scrollbar-color: rgba(110,231,210,.24) rgba(255,255,255,.035);
    }
    .table-wrap::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .table-wrap::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(255,255,255,.035);
    }
    .table-wrap::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(110,231,210,.20);
      border: 2px solid rgba(10,22,24,.86);
    }
    .table-wrap::-webkit-scrollbar-thumb:hover {
      background: rgba(110,231,210,.38);
    }
    .table-wrap::-webkit-scrollbar-corner {
      background: transparent;
    }
    table { width: 100%; min-width: 1460px; border-collapse: collapse; }
    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
      vertical-align: middle;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      color: var(--accent);
      background: rgba(13,24,26,.98);
      font-weight: 850;
      user-select: none;
    }
    th[data-sort] { cursor: pointer; }
    td.code { color: var(--accent); font-weight: 850; }
    .row-actions { display: flex; gap: 6px; }
    .op-btn { min-height: 30px; padding: 5px 8px; font-size: 12px; border-radius: 9px; }
    .pagination { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); }
    .pager { display: flex; gap: 8px; align-items: center; }
    .empty-state, .skeleton {
      border: 1px dashed var(--line-strong);
      border-radius: 14px;
      padding: 22px;
      color: var(--muted);
      text-align: center;
      background: rgba(255,255,255,.025);
    }
    .skeleton { display: none; }
    .is-loading .skeleton { display: block; }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(0,0,0,.42);
    }
    .drawer-backdrop.is-open { display: block; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 21;
      width: min(520px, 94vw);
      height: 100vh;
      transform: translateX(105%);
      transition: transform .22s ease;
      border-radius: 18px 0 0 18px;
      padding: 20px;
      overflow: auto;
      background: rgba(9, 17, 19, .96);
    }
    .drawer.is-open { transform: translateX(0); }
    .drawer-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 16px; }
    .drawer-grid { display: grid; gap: 12px; }
    .info-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: rgba(255,255,255,.035); }
    .info-list { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin-top: 10px; color: var(--muted); }
    .info-list strong { color: var(--ink); font-weight: 760; overflow-wrap: anywhere; }
    .photo-box {
      min-height: 130px;
      border: 1px dashed var(--line-strong);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(255,255,255,.025);
    }
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 30;
      max-width: 360px;
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      color: var(--ink);
      background: #0d181a;
      box-shadow: var(--shadow);
      display: none;
    }
    .toast.is-visible { display: block; }
    @media (max-width: 1380px) {
      .metric-grid { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
      .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .support-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "source source"
          "mix dept";
      }
      .priority-list { grid-template-columns: repeat(2, minmax(240px, 1fr)); max-height: 520px; }
      .quality-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .page { padding: 16px; }
      .platform-header, .hero-top, .filter-actions { align-items: stretch; grid-template-columns: 1fr; flex-direction: column; }
      .actions { justify-content: stretch; }
      .action-btn, .ghost-btn, .back-link { width: 100%; justify-content: center; }
      .metric-grid, .filters, .support-grid, .quality-grid, .donut-layout, .priority-list { grid-template-columns: 1fr; }
      .support-grid { grid-template-areas: "source" "mix" "dept"; }
      .source-panel .source-list { grid-template-columns: 1fr; }
      .priority-list { max-height: 480px; }
      .table-toolbar { grid-template-columns: 1fr; align-items: stretch; }
      .table-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); justify-content: stretch; }
      .table-actions > * { width: 100%; }
      .table-actions .table-btn, .table-actions .ghost-btn { width: 100%; }
      .priority-meta { grid-template-columns: 1fr; }
      .donut { margin: 0 auto; }
    }
</style>
</head>
<body>
  <div class="page">
    <header class="platform-header shell">
      <div class="brand">
        <img class="platform-mark" src="../../assets/jingtang-warehouse-logo-clear.png" alt="井唐仓储" />
        <div class="brand-title">
          <strong>仓储运营管理平台</strong>
          <div class="crumbs">运营驾驶舱 / 设备管理</div>
        </div>
      </div>
      <a class="back-link" href="../../index.html">返回主页</a>
    </header>

    <section class="filter-panel shell">
      <form class="filters" data-filters>
        <label class="field">设备大类<select name="major"><option value="">全部大类</option></select></label>
        <label class="field combo-field" data-name-combo>设备名称<div class="combo-input-wrap"><input name="name" type="search" autocomplete="off" placeholder="输入或选择设备名称" /><span class="combo-toggle">▾</span></div><div class="combo-menu" data-name-options></div></label>
        <label class="field">使用部门<select name="dept"><option value="">全部部门</option></select></label>
        <label class="field">使用人<select name="user"><option value="">全部使用人</option></select></label>
        <label class="field">管理人<select name="manager"><option value="">全部管理人</option></select></label>
        <label class="field">设备状态<select name="status"><option value="">全部状态</option></select></label>
        <label class="field">来源<select name="source"><option value="">全部来源</option></select></label>
        <label class="field">购入日期起<input name="dateStart" type="date" /></label>
        <label class="field">购入日期止<input name="dateEnd" type="date" /></label>
        <label class="field">金额下限<input name="amountMin" type="number" min="0" step="1" placeholder="0" /></label>
        <label class="field">金额上限<input name="amountMax" type="number" min="0" step="1" placeholder="不限" /></label>
        <label class="field">资产编码<input name="code" type="search" placeholder="搜索资产编码" /></label>
      </form>
      <div class="filter-actions">
        <span class="active-note" data-active-note>当前展示全部台账数据</span>
        <button class="ghost-btn" data-reset type="button">清空筛选</button>
      </div>
    </section>

    <section class="metric-grid" data-metrics></section>

    <main>
      <section class="panel ledger-panel" id="asset-table">
        <div class="table-toolbar">
          <div>
            <span class="panel-label">Asset Ledger</span>
            <h2>完整资产台账</h2>
          </div>
          <div class="table-actions">
            <span class="muted" data-selected-info>已选择 0 条</span>
            <button class="table-btn" data-export-selected>批量导出</button>
            <label class="field">每页<select data-page-size><option selected>13</option><option>50</option><option>100</option><option>200</option></select></label>
            <div class="column-menu">
              <details>
                <summary class="table-btn">列显示设置</summary>
                <div class="column-panel" data-column-panel></div>
              </details>
            </div>
          </div>
        </div>
        <div class="skeleton">正在加载资产台账...</div>
        <div class="table-wrap">
          <table>
            <thead><tr data-table-head></tr></thead>
            <tbody data-table-body></tbody>
          </table>
        </div>
        <div class="empty-state" data-empty hidden>当前筛选条件下没有资产记录</div>
        <div class="pagination">
          <span data-page-info>第 1 / 1 页</span>
          <div class="pager">
            <button class="table-btn" data-prev>上一页</button>
            <button class="table-btn" data-next>下一页</button>
          </div>
        </div>
      </section>

      <section class="support-grid">
        <section class="panel source-panel">
          <div class="panel-head"><div><span class="panel-label">Source</span><h2>资产来源分析</h2></div><p class="muted">当前源数据：自建 1235 / 购入 169 / 租赁 5</p></div>
          <div class="source-list" data-source-list></div>
        </section>
        <section class="panel mix-panel">
          <div class="panel-head"><div><span class="panel-label">Device Mix</span><h2>设备分类分布</h2></div><p class="muted">点击分类联动筛选</p></div>
          <div class="donut-layout">
            <div class="donut" data-major-donut data-total="0"></div>
            <div class="chart-list" data-major-legend></div>
          </div>
        </section>
        <section class="panel dept-panel">
          <div class="panel-head"><div><span class="panel-label">Department</span><h2>部门设备分布</h2></div><p class="muted">悬停查看完整部门路径</p></div>
          <div class="dept-bars" data-dept-bars></div>
        </section>
      </section>

      <section class="panel priority-panel">
        <div class="panel-head"><div><span class="panel-label">Priority Assets</span><h2>重点设备</h2></div></div>
        <div class="priority-list" data-important-list></div>
      </section>
    </main>
  </div>

  <div class="drawer-backdrop" data-drawer-backdrop></div>
  <aside class="drawer" data-drawer>
    <div class="drawer-top">
      <div><span class="panel-label">Asset Detail</span><h2 data-drawer-title>设备详情</h2><p class="muted" data-drawer-code></p></div>
      <button class="ghost-btn" data-close-drawer>关闭</button>
    </div>
    <div class="drawer-grid" data-drawer-content></div>
  </aside>
  <div class="toast" data-toast></div>
  <script src="./data/equipment-data.js"></script>
  <script>
(() => {
  const payload = window.EQUIPMENT_DATA || { records: [] };
  const allRecords = payload.records || [];
  const state = {
    filters: {
      major: "", name: "", dept: "", user: "", manager: "", status: "", source: "",
      dateStart: "", dateEnd: "", amountMin: "", amountMax: "", code: "", quick: ""
    },
    page: 1,
    pageSize: 13,
    sortKey: "assetCode",
    sortDir: "asc",
    selected: new Set(),
    visibleColumns: new Set(["assetCode","name","major","status","spec","dept","user","manager","location","source","amount","purchaseDate","term","completeness","actions"])
  };

  const COLUMNS = [
    ["select", ""], ["assetCode", "资产编码"], ["name", "设备名称"], ["major", "设备大类"], ["status", "设备状态"],
    ["spec", "规格型号"], ["dept", "使用部门"], ["user", "使用人"], ["manager", "管理人"], ["location", "存放地点"],
    ["source", "来源"], ["amount", "金额"], ["purchaseDate", "购入日期"], ["term", "使用期限"], ["completeness", "数据完整度"], ["actions", "操作"]
  ];
  const PALETTE = ["#6ee7d2", "#ffe0a3", "#8fb8ff", "#f5c77a", "#b7f7a8", "#ffb3a7", "#b9a7ff"];
  const els = {
    filters: document.querySelector("[data-filters]"),
    activeNote: document.querySelector("[data-active-note]"),
    metrics: document.querySelector("[data-metrics]"),
    majorDonut: document.querySelector("[data-major-donut]"),
    majorLegend: document.querySelector("[data-major-legend]"),
    deptBars: document.querySelector("[data-dept-bars]"),
    importantList: document.querySelector("[data-important-list]"),
    sourceList: document.querySelector("[data-source-list]"),
    qualityList: document.querySelector("[data-quality-list]"),
    tableHead: document.querySelector("[data-table-head]"),
    tableBody: document.querySelector("[data-table-body]"),
    empty: document.querySelector("[data-empty]"),
    pageInfo: document.querySelector("[data-page-info]"),
    selectedInfo: document.querySelector("[data-selected-info]"),
    columnPanel: document.querySelector("[data-column-panel]"),
    drawer: document.querySelector("[data-drawer]"),
    drawerBackdrop: document.querySelector("[data-drawer-backdrop]"),
    toast: document.querySelector("[data-toast]")
  };

  const nf = new Intl.NumberFormat("zh-CN");
  const cf = new Intl.NumberFormat("zh-CN", { style: "currency", currency: "CNY", maximumFractionDigits: 0 });

  function unique(key) {
    return Array.from(new Set(allRecords.map((r) => r[key]).filter(Boolean))).sort((a, b) => String(a).localeCompare(String(b), "zh-Hans-CN"));
  }
  function fillSelect(name, values) {
    const select = els.filters.querySelector(`[name="${name}"]`);
    if (!select) return;
    values.forEach((value) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
  }
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }
  function setupNameCombo() {
    const field = document.querySelector("[data-name-combo]");
    const input = field?.querySelector('[name="name"]');
    const menu = field?.querySelector("[data-name-options]");
    if (!field || !input || !menu) return;
    const counts = countBy(allRecords, "name").sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN"));

    function renderOptions(open = true) {
      const keyword = input.value.trim().toLowerCase();
      const options = counts
        .filter((item) => !keyword || item.name.toLowerCase().includes(keyword))
        .slice(0, 80);
      menu.innerHTML = options.length
        ? options.map((item) => `<button class="combo-option" type="button" data-value="${escapeHtml(item.name)}"><span>${escapeHtml(item.name)}</span><small>${nf.format(item.count)} 件</small></button>`).join("")
        : `<div class="combo-empty">没有匹配的设备名称，继续输入可按关键词筛选</div>`;
      menu.classList.toggle("is-open", open);
      menu.querySelectorAll("[data-value]").forEach((button) => {
        button.addEventListener("mousedown", (event) => {
          event.preventDefault();
          input.value = button.dataset.value;
          state.filters.name = input.value;
          state.page = 1;
          menu.classList.remove("is-open");
          render();
        });
      });
    }

    input.addEventListener("focus", () => renderOptions(true));
    input.addEventListener("input", () => renderOptions(true));
    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") menu.classList.remove("is-open");
    });
    document.addEventListener("mousedown", (event) => {
      if (!field.contains(event.target)) menu.classList.remove("is-open");
    });
  }
  function showToast(message) {
    els.toast.textContent = message;
    els.toast.classList.add("is-visible");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => els.toast.classList.remove("is-visible"), 2400);
  }
  function amount(record) { return Number(record.amount || 0); }
  function termMissing(record) { return !record.term || Number(record.term) === 0; }
  function hasIssue(record, issue) {
    if (issue === "zeroAmount") return amount(record) === 0;
    if (issue === "photoMissing") return !record.photo;
    if (issue === "serialMissing") return !record.serial;
    if (issue === "locationMissing") return !record.storageLocation;
    if (issue === "supplierMissing") return !record.supplier;
    if (issue === "termMissing") return termMissing(record);
    if (issue === "abnormal") return record.issues.length > 0;
    return false;
  }
  function matches(record) {
    const f = state.filters;
    if (f.major && record.major !== f.major) return false;
    if (f.name && !record.name.toLowerCase().includes(f.name.toLowerCase())) return false;
    if (f.dept && record.dept !== f.dept) return false;
    if (f.user && record.user !== f.user) return false;
    if (f.manager && record.manager !== f.manager) return false;
    if (f.status && record.status !== f.status) return false;
    if (f.source && record.source !== f.source) return false;
    if (f.code && !record.assetCode.toLowerCase().includes(f.code.toLowerCase())) return false;
    if (f.dateStart && (!record.purchaseDate || record.purchaseDate < f.dateStart)) return false;
    if (f.dateEnd && (!record.purchaseDate || record.purchaseDate > f.dateEnd)) return false;
    if (f.amountMin !== "" && amount(record) < Number(f.amountMin)) return false;
    if (f.amountMax !== "" && amount(record) > Number(f.amountMax)) return false;
    if (f.quick === "highValue" && amount(record) < 10000) return false;
    if (f.quick === "zeroAmount" && amount(record) !== 0) return false;
    if (f.quick === "abnormal" && !hasIssue(record, "abnormal")) return false;
    if (f.quick && f.quick.startsWith("issue:") && !hasIssue(record, f.quick.slice(6))) return false;
    if (f.quick === "automation" && record.major !== "自动化设备") return false;
    return true;
  }
  function filteredRecords() { return allRecords.filter(matches); }
  function sum(records, key = "amount") { return records.reduce((total, record) => total + Number(record[key] || 0), 0); }
  function countBy(records, key) {
    const map = new Map();
    records.forEach((record) => map.set(record[key] || "未填写", (map.get(record[key] || "未填写") || 0) + 1));
    return Array.from(map, ([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "zh-Hans-CN"));
  }
  function groupByMajor(records) {
    const map = new Map();
    records.forEach((record) => {
      const item = map.get(record.major) || { name: record.major, count: 0, amount: 0 };
      item.count += 1;
      item.amount += amount(record);
      map.set(record.major, item);
    });
    return Array.from(map.values()).sort((a, b) => b.count - a.count);
  }
  function activeLabel() {
    const f = state.filters;
    const labels = [];
    if (f.quick) labels.push("快捷筛选");
    [["major","大类"],["dept","部门"],["user","使用人"],["manager","管理人"],["status","状态"],["source","来源"]].forEach(([key, label]) => {
      if (f[key]) labels.push(`${label}:${f[key]}`);
    });
    if (f.name) labels.push(`名称:${f.name}`);
    if (f.code) labels.push(`编码:${f.code}`);
    if (f.dateStart || f.dateEnd) labels.push("购入日期区间");
    if (f.amountMin !== "" || f.amountMax !== "") labels.push("金额区间");
    return labels.length ? labels.join(" / ") : "当前展示全部台账数据";
  }
  function setQuick(value) {
    state.filters.quick = state.filters.quick === value ? "" : value;
    state.page = 1;
    render();
  }
  function setFilter(key, value) {
    const nextValue = state.filters[key] === value ? "" : value;
    state.filters[key] = nextValue;
    const control = els.filters.querySelector(`[name="${key}"]`);
    if (control) control.value = nextValue;
    state.page = 1;
    render();
  }
  function clearFilters() {
    Object.keys(state.filters).forEach((key) => state.filters[key] = "");
    els.filters.reset();
    state.page = 1;
    render();
  }
  function metricCard(label, value, hint, quick, tone) {
    return `<button class="metric-card ${quick && state.filters.quick === quick ? "is-active" : ""}" data-quick="${quick || ""}" data-tone="${tone || "mint"}">
      <span>${label}</span><strong>${value}</strong><small>${hint}</small>
    </button>`;
  }
  function renderMetrics(records) {
    const deptCount = new Set(records.map((r) => r.dept).filter(Boolean)).size;
    const high = records.filter((r) => amount(r) >= 10000).length;
    const zero = records.filter((r) => amount(r) === 0).length;
    els.metrics.innerHTML = [
      metricCard("设备总数", nf.format(records.length), "点击恢复总览", "", "mint"),
      metricCard("资产总金额", cf.format(sum(records)), "随筛选实时变化", "", "gold"),
      metricCard("重点设备数量", nf.format(high), "单价 ≥ 10000 元", "highValue", "blue"),
      metricCard("设备覆盖部门", nf.format(deptCount), "按使用部门去重", "", "lime"),
      metricCard("金额未登记设备", nf.format(zero), "金额为 0", "zeroAmount", "rose")
    ].join("");
    els.metrics.querySelectorAll("[data-quick]").forEach((button) => {
      button.addEventListener("click", () => {
        const quick = button.dataset.quick;
        if (!quick) {
          state.filters.quick = "";
          state.page = 1;
          render();
        } else {
          setQuick(quick);
        }
      });
    });
  }
  function renderMajor(records) {
    const groups = groupByMajor(records);
    const total = Math.max(records.length, 1);
    let start = 0;
    const stops = groups.map((g, index) => {
      const deg = g.count / total * 360;
      const segment = `${PALETTE[index % PALETTE.length]} ${start}deg ${start + deg}deg`;
      start += deg;
      return segment;
    }).join(", ");
    els.majorDonut.style.background = `conic-gradient(${stops || "rgba(255,255,255,.08) 0 360deg"})`;
    els.majorDonut.dataset.total = nf.format(records.length);
    els.majorLegend.innerHTML = groups.map((g, index) => `
      <div class="chart-row ${state.filters.major === g.name ? "is-active" : ""}" data-major="${g.name}">
        <div class="row-main"><strong><span style="color:${PALETTE[index % PALETTE.length]}">●</span> ${g.name}</strong><span>${nf.format(g.count)} 件</span></div>
        <div class="row-main muted"><span>${(g.count / total * 100).toFixed(1)}%</span><span>${cf.format(g.amount)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="--w:${g.count / total * 100}%; --bar-color:${PALETTE[index % PALETTE.length]}"></div></div>
      </div>
    `).join("") || `<div class="empty-state">暂无分类数据</div>`;
    els.majorLegend.querySelectorAll("[data-major]").forEach((row) => row.addEventListener("click", () => {
      els.filters.querySelector('[name="major"]').value = row.dataset.major;
      setFilter("major", row.dataset.major);
    }));
  }
  function shortDept(name) {
    const parts = String(name || "未填写").split("/");
    return parts.length > 2 ? `${parts[parts.length - 2]}/${parts[parts.length - 1]}` : parts.join("/");
  }
  function renderDepartments(records) {
    const groups = countBy(records, "dept").slice(0, 12);
    const max = Math.max(...groups.map((g) => g.count), 1);
    els.deptBars.innerHTML = groups.map((g, index) => `
      <div class="dept-row ${state.filters.dept === g.name ? "is-active" : ""}" data-dept="${g.name}" title="${g.name}">
        <div class="dept-name">${shortDept(g.name)}</div>
        <div class="bar-track"><div class="bar-fill" style="--w:${g.count / max * 100}%; --bar-color:${PALETTE[index % PALETTE.length]}"></div></div>
        <div class="dept-count">${nf.format(g.count)}</div>
      </div>
    `).join("") || `<div class="empty-state">暂无部门数据</div>`;
    els.deptBars.querySelectorAll("[data-dept]").forEach((row) => row.addEventListener("click", () => {
      els.filters.querySelector('[name="dept"]').value = row.dataset.dept;
      setFilter("dept", row.dataset.dept);
    }));
  }
  function renderImportant(records) {
    const important = records
      .filter((r) => amount(r) >= 10000 || r.major === "自动化设备")
      .sort((a, b) => amount(b) - amount(a))
      .slice(0, 14);
    els.importantList.innerHTML = important.map((r) => `
      <div class="priority-row" data-open="${r.assetCode}">
        <div class="priority-title"><strong>${r.name}</strong><span>${cf.format(amount(r))}</span></div>
        <div class="priority-meta"><span>${r.assetCode}</span><span title="${r.dept}">${shortDept(r.dept)}</span><span>${r.manager || "未填写"}</span></div>
        <div class="tags">${r.riskTags.filter((tag) => tag !== "台账缺项").map((tag) => `<span class="tag">${tag}</span>`).join("")}</div>
      </div>
    `).join("") || `<div class="empty-state">当前筛选下暂无重点设备</div>`;
    els.importantList.querySelectorAll("[data-open]").forEach((row) => row.addEventListener("click", () => openDrawer(row.dataset.open)));
  }
  function renderSource(records) {
    const groups = countBy(records, "source");
    const total = Math.max(records.length, 1);
    els.sourceList.innerHTML = groups.map((g, index) => `
      <div class="source-row ${state.filters.source === g.name ? "is-active" : ""}" data-source="${g.name}">
        <div class="row-main"><strong>${g.name}</strong><span>${nf.format(g.count)} 件 / ${(g.count / total * 100).toFixed(1)}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="--w:${g.count / total * 100}%; --bar-color:${PALETTE[index % PALETTE.length]}"></div></div>
      </div>
    `).join("") || `<div class="empty-state">暂无来源数据</div>`;
    els.sourceList.querySelectorAll("[data-source]").forEach((row) => row.addEventListener("click", () => {
      els.filters.querySelector('[name="source"]').value = row.dataset.source;
      setFilter("source", row.dataset.source);
    }));
  }
  function renderQuality(records) {
    if (!els.qualityList) return;
    const items = [
      ["zeroAmount", "金额为 0", records.filter((r) => amount(r) === 0).length, "warn"],
      ["photoMissing", "照片缺失", records.filter((r) => !r.photo).length, "warn"],
      ["serialMissing", "序列号缺失", records.filter((r) => !r.serial).length, "warn"],
      ["locationMissing", "存放地点缺失", records.filter((r) => !r.storageLocation).length, "danger"],
      ["supplierMissing", "供应商缺失", records.filter((r) => !r.supplier).length, "danger"],
      ["termMissing", "使用期限缺失/0", records.filter(termMissing).length, "warn"]
    ];
    els.qualityList.innerHTML = items.map(([key, label, count, tone]) => `
      <button class="quality-card" data-issue="${key}">
        <span class="tag ${tone}">${label}</span>
        <strong>${nf.format(count)}</strong>
        <small class="muted">点击筛选异常资产</small>
      </button>
    `).join("");
    els.qualityList.querySelectorAll("[data-issue]").forEach((card) => card.addEventListener("click", () => setQuick(`issue:${card.dataset.issue}`)));
  }
  function renderColumns() {
    els.tableHead.innerHTML = COLUMNS.filter(([key]) => key === "select" || state.visibleColumns.has(key)).map(([key, label]) => {
      if (key === "select") return `<th><input type="checkbox" data-select-page></th>`;
      return `<th data-sort="${key}">${label}</th>`;
    }).join("");
    els.tableHead.querySelectorAll("[data-sort]").forEach((th) => th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      else { state.sortKey = key; state.sortDir = "asc"; }
      renderTable(filteredRecords());
    }));
    els.tableHead.querySelector("[data-select-page]")?.addEventListener("change", (event) => {
      document.querySelectorAll("[data-row-select]").forEach((box) => {
        box.checked = event.target.checked;
        if (box.checked) state.selected.add(box.value);
        else state.selected.delete(box.value);
      });
      renderSelectedInfo();
    });
  }
  function valueForSort(record, key) {
    if (key === "amount") return amount(record);
    if (key === "completeness") return record.completeness;
    return String(record[key] || "");
  }
  function renderTable(records) {
    renderColumns();
    const sorted = [...records].sort((a, b) => {
      const av = valueForSort(a, state.sortKey);
      const bv = valueForSort(b, state.sortKey);
      const result = typeof av === "number" && typeof bv === "number" ? av - bv : String(av).localeCompare(String(bv), "zh-Hans-CN");
      return state.sortDir === "asc" ? result : -result;
    });
    const pageCount = Math.max(Math.ceil(sorted.length / state.pageSize), 1);
    state.page = Math.min(state.page, pageCount);
    const pageRows = sorted.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
    els.empty.hidden = sorted.length !== 0;
    els.tableBody.innerHTML = pageRows.map((r) => {
      const cells = COLUMNS.filter(([key]) => key !== "select" && state.visibleColumns.has(key)).map(([key]) => {
        if (key === "assetCode") return `<td class="code" data-open="${r.assetCode}">${r.assetCode}</td>`;
        if (key === "amount") return `<td>${cf.format(amount(r))}</td>`;
        if (key === "completeness") {
          const tone = r.completeness < 65 ? "danger" : r.completeness < 85 ? "warn" : "";
          return `<td><span class="tag ${tone}">${r.completeness}%</span></td>`;
        }
        if (key === "actions") return `<td><div class="row-actions"><button class="op-btn" data-action="查看详情" data-code="${r.assetCode}">查看详情</button></div></td>`;
        return `<td title="${r[key] || "未填写"}">${r[key] || "未填写"}</td>`;
      }).join("");
      return `<tr><td><input type="checkbox" value="${r.assetCode}" data-row-select ${state.selected.has(r.assetCode) ? "checked" : ""}></td>${cells}</tr>`;
    }).join("");
    els.pageInfo.textContent = `第 ${state.page} / ${pageCount} 页，共 ${nf.format(sorted.length)} 条`;
    els.tableBody.querySelectorAll("[data-row-select]").forEach((box) => box.addEventListener("change", () => {
      if (box.checked) state.selected.add(box.value);
      else state.selected.delete(box.value);
      renderSelectedInfo();
    }));
    els.tableBody.querySelectorAll("[data-open]").forEach((cell) => cell.addEventListener("click", () => openDrawer(cell.dataset.open)));
    els.tableBody.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", (event) => {
      event.stopPropagation();
      openDrawer(button.dataset.code);
    }));
    renderSelectedInfo();
  }
  function renderSelectedInfo() {
    els.selectedInfo.textContent = `已选择 ${nf.format(state.selected.size)} 条`;
  }
  function renderColumnPanel() {
    els.columnPanel.innerHTML = COLUMNS.filter(([key]) => key !== "select").map(([key, label]) => `
      <label><input type="checkbox" value="${key}" ${state.visibleColumns.has(key) ? "checked" : ""} ${key === "actions" ? "disabled" : ""}>${label}</label>
    `).join("");
    els.columnPanel.querySelectorAll("input").forEach((box) => box.addEventListener("change", () => {
      if (box.checked) state.visibleColumns.add(box.value);
      else state.visibleColumns.delete(box.value);
      renderTable(filteredRecords());
    }));
  }
  function openDrawer(code) {
    const record = allRecords.find((r) => r.assetCode === code);
    if (!record) return;
    els.drawer.querySelector("[data-drawer-title]").textContent = record.name || "设备详情";
    els.drawer.querySelector("[data-drawer-code]").textContent = record.assetCode;
    els.drawer.querySelector("[data-drawer-content]").innerHTML = `
      <section class="info-card"><h3>基础信息</h3><div class="info-list">
        <span>设备大类</span><strong>${record.major}</strong><span>设备状态</span><strong>${record.status}</strong><span>规格型号</span><strong>${record.spec || "未填写"}</strong><span>来源</span><strong>${record.source || "未填写"}</strong>
      </div></section>
      <section class="info-card"><h3>归属信息</h3><div class="info-list">
        <span>使用部门</span><strong>${record.dept || "未填写"}</strong><span>使用人</span><strong>${record.user || "未填写"}</strong><span>管理人</span><strong>${record.manager || "未填写"}</strong><span>存放地点</span><strong>${record.storageLocation || "未填写"}</strong>
      </div></section>
      <section class="info-card"><h3>价值信息</h3><div class="info-list">
        <span>金额</span><strong>${cf.format(amount(record))}</strong><span>购入日期</span><strong>${record.purchaseDate || "未填写"}</strong><span>使用期限</span><strong>${record.term || "未填写"}</strong><span>供应商</span><strong>${record.supplier || "未填写"}</strong>
      </div></section>
      <section class="info-card"><h3>设备照片</h3><div class="photo-box">${record.photo ? record.photo : "本次台账未提供可展示照片"}</div></section>
      <section class="info-card"><h3>台账完整情况</h3><div class="tags">${record.issues.length ? record.issues.map((i) => `<span class="tag warn">${i}</span>`).join("") : `<span class="tag">字段完整</span>`}</div></section>
      <section class="info-card"><h3>历史操作记录</h3><p class="muted">当前台账未提供维修、保养、调拨或盘点历史，页面仅展示可确认的台账信息。</p></section>
    `;
    els.drawer.classList.add("is-open");
    els.drawerBackdrop.classList.add("is-open");
  }
  function closeDrawer() {
    els.drawer.classList.remove("is-open");
    els.drawerBackdrop.classList.remove("is-open");
  }
  function exportCsv(records) {
    const rows = records.map((r) => COLUMNS.filter(([key]) => !["select","actions"].includes(key)).map(([key]) => {
      if (key === "amount") return amount(r);
      if (key === "completeness") return `${r.completeness}%`;
      return r[key] || "";
    }));
    const header = COLUMNS.filter(([key]) => !["select","actions"].includes(key)).map(([, label]) => label);
    const csv = [header, ...rows].map((row) => row.map((cell) => `"${String(cell).replaceAll('"', '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `设备台账_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
  }
  function render() {
    const records = filteredRecords();
    els.activeNote.textContent = activeLabel();
    renderMetrics(records);
    renderMajor(records);
    renderDepartments(records);
    renderImportant(records);
    renderSource(records);
    renderQuality(records);
    renderTable(records);
  }

  fillSelect("major", unique("major"));
  setupNameCombo();
  fillSelect("dept", unique("dept"));
  fillSelect("user", unique("user"));
  fillSelect("manager", unique("manager"));
  fillSelect("status", unique("status"));
  fillSelect("source", unique("source"));
  renderColumnPanel();
  els.filters.addEventListener("input", (event) => {
    if (!event.target.name) return;
    state.filters[event.target.name] = event.target.value;
    state.page = 1;
    render();
  });
  els.filters.addEventListener("change", (event) => {
    if (!event.target.name) return;
    state.filters[event.target.name] = event.target.value;
    state.page = 1;
    render();
  });
  document.querySelector("[data-reset]").addEventListener("click", clearFilters);
  document.querySelector("[data-prev]").addEventListener("click", () => { state.page = Math.max(1, state.page - 1); renderTable(filteredRecords()); });
  document.querySelector("[data-next]").addEventListener("click", () => { state.page += 1; renderTable(filteredRecords()); });
  document.querySelector("[data-page-size]").addEventListener("change", (event) => { state.pageSize = Number(event.target.value); state.page = 1; renderTable(filteredRecords()); });
  document.querySelector("[data-export]")?.addEventListener("click", () => exportCsv(filteredRecords()));
  document.querySelector("[data-export-selected]")?.addEventListener("click", () => exportCsv(allRecords.filter((r) => state.selected.has(r.assetCode))));
  document.querySelector("[data-import]")?.addEventListener("click", () => showToast("导入台账入口已预留；当前数据来自最新 Excel 台账"));
  document.querySelector("[data-new]")?.addEventListener("click", () => showToast("新增设备入口已预留；未写入本地台账"));
  document.querySelector("[data-inventory]")?.addEventListener("click", () => { setQuick("abnormal"); showToast("已按台账异常设备生成盘点范围"); });
  document.querySelector("[data-close-drawer]").addEventListener("click", closeDrawer);
  els.drawerBackdrop.addEventListener("click", closeDrawer);
  render();
})();
</script>
</body>
</html>
